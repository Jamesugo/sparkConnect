<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CD479W7GGP"></script>
    <script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electrician Profile - SparkConnect</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }

      .profile-header-container {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        padding: 60px 0 40px 0;
        position: relative;
        overflow: hidden;
      }

      .profile-header-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 80% 20%, rgba(0, 112, 243, 0.2) 0%, transparent 40%);
        pointer-events: none;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 40px;
        position: relative;
        z-index: 10;
      }

      .profile-avatar {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        border: 6px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        background-color: #eee;
        transition: transform 0.3s ease;
      }
      
      .profile-avatar:hover {
        transform: scale(1.05);
      }

      .profile-info {
        color: white;
      }

      .profile-info h1 {
        font-size: 2.5rem;
        margin-bottom: 8px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .profile-badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 15px;
      }
      
      .badge {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(5px);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.3px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .badge-primary {
        background: var(--primary-blue);
        color: white;
        border: none;
      }

      .profile-stats {
        margin-top: 15px;
        color: #cbd5e1;
        display: flex;
        gap: 20px;
        font-size: 0.95rem;
      }
      
      .stat-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .content-section {
        padding: 60px 0;
        background: white;
        border-radius: 20px;
        margin-top: -30px;
        position: relative;
        z-index: 20;
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.05);
        max-width: 1100px;
        margin-left: auto;
        margin-right: auto;
        padding: 40px 50px;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 25px;
      }

      .gallery-item {
        aspect-ratio: 1;
        border-radius: 15px;
        overflow: hidden;
        background-color: #eee;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        position: relative;
      }

      .gallery-item img, .gallery-item video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .gallery-item:hover img, .gallery-item:hover video {
        transform: scale(1.1);
      }
      
      .review-card {
        background: #f8fafc;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid rgba(0,0,0,0.03);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      
      .review-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      }
      
      .btn-primary {
        background: linear-gradient(135deg, var(--primary-blue) 0%, #0056b3 100%);
        border: none;
        box-shadow: 0 4px 15px rgba(0, 112, 243, 0.4);
        padding: 12px 28px;
        font-weight: 600;
        border-radius: 10px;
        transition: all 0.3s ease;
        color: white;
        cursor: pointer;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 112, 243, 0.5);
      }
      
      .btn-outline {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255,255,255,0.3);
        color: white;
        padding: 12px 28px;
        font-weight: 600;
        border-radius: 10px;
        transition: all 0.3s ease;
        cursor: pointer;
      }
      
      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      
      .review-form-container {
        background: white;
        padding: 30px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      }

      input[type="text"], textarea {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background-color: #f8fafc;
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      input:focus, textarea:focus {
        outline: none;
        border-color: var(--primary-blue);
        background-color: white;
        box-shadow: 0 0 0 4px rgba(0, 112, 243, 0.1);
      }

      @media (max-width: 670px) {
        .profile-header {
          flex-direction: column;
          text-align: center;
          gap: 20px;
        }

        .profile-badges {
          justify-content: center;
        }

        .profile-stats {
          justify-content: center;
          flex-direction: column;
          gap: 5px;
        }
        
        .content-section {
          padding: 30px 20px;
          border-radius: 20px 20px 0 0;
          margin-top: -20px;
        }
        
        .profile-info > div:last-child {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <!-- Nav rendered by js/nav.js -->
    <nav></nav>

    <div id="profile-content">
      <!-- Rendered by JS -->
    </div>

    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/modal.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get("id");
      // Ensure API_BASE_URL is defined
      if (typeof API_BASE_URL === "undefined") {
        window.API_BASE_URL =
          window.location.port === "5500" ? "http://127.0.0.1:5000" : "";
      }
      let electrician = null;

      async function initProfile() {
        try {
          electrician = await DataManager.getElectricianById(id);
          if (!electrician) {
            document.getElementById("profile-content").innerHTML =
              "<div class='container' style='padding:50px;'>User not found</div>";
            return;
          }
          await renderProfile();
          loadGalleryImages();
          loadReviews();
        } catch (e) {
          console.error(e);
          document.getElementById("profile-content").innerHTML =
            "<div class='container' style='padding:50px;'>Error loading profile</div>";
        }
      }

      async function renderProfile() {
        const container = document.getElementById("profile-content");

        // Check if current user is admin
        const currentUser = await DataManager.getCurrentUser();
        const isAdmin =
          currentUser && currentUser.email === "admin@sparkconnect.com";

        container.innerHTML = `
                <div class="profile-header-container">
                    <div class="container profile-header">
                        <img src="${
                          electrician.image &&
                          !electrician.image.startsWith("http")
                            ? API_BASE_URL + "/" + electrician.image
                            : electrician.image ||
                              "assets/images/profile_placeholder.jpg"
                        }" alt="${
          electrician.name
        }" class="profile-avatar" onerror="this.onerror=null; this.src='assets/images/profile_placeholder.jpg'">
                        <div class="profile-info">
                            <h1>${electrician.name}</h1>
                            <div class="profile-badges">
                                <span class="badge badge-primary">${electrician.specialty || "Electrician"}</span>
                                <span class="badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:-2px;margin-right:2px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> ${electrician.state || "NG"}</span>
                                <span class="badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:-2px;margin-right:2px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Licensed</span>
                            </div>
                            <div class="profile-stats">
                                <div class="stat-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#fbbf24;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> ${electrician.rating || 0} (${electrician.reviews || 0} reviews)</div>
                                ${electrician.email ? `<div class="stat-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> ${electrician.email}</div>` : ""}
                                ${electrician.phone ? `<div class="stat-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg> ${electrician.phone}</div>` : ""}
                            </div>
                            
                            <div style="margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: flex-start;">
                                <button class="btn btn-primary contact-btn" onclick="contactElectrician()" style="background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); display: flex; align-items: center; gap: 8px;">
                                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                  WhatsApp
                                </button>
                                <button class="btn btn-outline" style="display: flex; align-items: center; gap: 8px;">
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                                  Share Profile
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="container" style="max-width: 1150px;">
                <div class="content-section">
                    <section style="margin-bottom: 50px;">
                        <h2 style="margin-bottom: 20px; font-size: 1.8rem; font-weight: 700; color: #1e293b;">About Me</h2>
                        <p style="color: #475569; line-height: 1.8; font-size: 1.05rem;">${
                          electrician.description || "No description provided."
                        }</p>
                    </section>
                    
                    ${
                      isAdmin
                        ? `<div id="admin-panel" style="margin-top: 40px; padding: 25px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px;">
                             <h3 style="color: #dc2626; margin-bottom: 10px;">Admin: Danger Zone</h3>
                             <p style="color: #7f1d1d; margin-bottom: 20px;">Permanently delete this account and remove all data.</p>
                             <button onclick="deleteAccount('${electrician.id}')" class="btn" style="background-color: #dc2626; color: white; border: none;">Delete Account</button>
                    </div>`
                        : ""
                    }

                    <section style="margin-bottom: 50px;">
                        <h2 style="margin-bottom: 10px; font-size: 1.8rem; font-weight: 700; color: #1e293b;">Gallery</h2>
                        <p style="color: #64748b; margin-bottom: 20px;">Photos and videos of my recent work</p>
                        <div id="profile-gallery-grid" class="gallery-grid">
                            <p style="color: #94a3b8;">Loading gallery...</p>
                        </div>
                    </section>

                    <section>
                        <h2 style="margin-bottom: 20px; font-size: 1.8rem; font-weight: 700; color: #1e293b;">Reviews</h2>
                        
                        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 35px; background: #f8fafc; padding: 25px; border-radius: 16px;">
                             <h1 style="font-size: 3.5rem; font-weight: 700; color: #0f172a; line-height: 1;">${
                               electrician.rating || 0
                             }</h1>
                             <div>
                                <div style="color: #fbbf24; font-size: 1.2rem; letter-spacing: 2px;">★★★★★</div>
                                <div style="color: #64748b; font-weight: 500; margin-top: 5px;">Based on ${
                                  electrician.reviews || 0
                                } reviews</div>
                             </div>
                        </div>

                        <!-- Add Review Form -->
                        <div class="review-form-container" style="margin-bottom: 40px;">
                            <h3 style="margin-bottom: 20px; font-size: 1.3rem; color: #1e293b;">Leave a Review</h3>
                            <form id="review-form">
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #334155;">Rating</label>
                                    <div class="star-rating" style="font-size: 2rem; cursor: pointer;">
                                        <span class="star" data-rating="1">☆</span>
                                        <span class="star" data-rating="2">☆</span>
                                        <span class="star" data-rating="3">☆</span>
                                        <span class="star" data-rating="4">☆</span>
                                        <span class="star" data-rating="5">☆</span>
                                    </div>
                                    <input type="hidden" id="rating-value" required>
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #334155;">Your Name</label>
                                    <input type="text" id="reviewer-name" placeholder="Enter your name" value="${currentUser ? currentUser.name : ''}" required style="max-width: 400px;">
                                </div>
                                <div style="margin-bottom: 25px;">
                                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #334155;">Comment (Optional)</label>
                                    <textarea id="review-comment" rows="4" placeholder="Share your experience..." style="max-width: 600px; resize: vertical;"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Submit Review</button>
                            </form>
                        </div>

                        <!-- Reviews List -->
                        <div id="reviews-list">
                            <!-- Populated by JS -->
                        </div>
                    </section>
                </div>
                </div>
            `;

        // Re-bind star listeners since DOM changed
        initStarRating();
      }

      function contactElectrician() {
        if (electrician.whatsapp) {
          window.open(electrician.whatsapp, "_blank");
        } else if (electrician.phone) {
          window.location.href = "tel:" + electrician.phone;
        } else if (electrician.email) {
          window.location.href = "mailto:" + electrician.email;
        }
        if (!electrician.email && !electrician.phone && !electrician.whatsapp) {
          ModalManager.alert("No contact information available for this user.", "Notice");
          return;
        }
      }

      // Admin function to delete account
      function deleteAccount(userId) {
        ModalManager.confirm("Are you sure you want to permanently delete this user account? This action cannot be undone.", "Delete Account", async () => {
          try {
            await DataManager.deleteUser(userId);
            ModalManager.alert("User account deleted successfully", "Success");
            setTimeout(() => window.location.href = "index.html", 1500);
          } catch (err) {
            ModalManager.alert("Failed to delete account: " + err.message, "Error");
          }
        });
      }

      // Async Gallery Loader
      function loadGalleryImages() {
        const gallery = electrician.gallery || [];
        const container = document.getElementById("profile-gallery-grid");
        if (!container) return;

        if (gallery.length === 0) {
          container.innerHTML =
            '<p style="color:var(--text-gray);">No work uploaded yet.</p>';
          return;
        }

        // Just use the strings (URLs from server)
        const renderedItems = gallery.map((item) => {
          let src = item.startsWith("http")
            ? item
            : API_BASE_URL
            ? `${API_BASE_URL}/${item}`
            : item;
          let isVideo =
            item.endsWith(".mp4") ||
            item.endsWith(".mov") ||
            item.endsWith(".webm");

          let mediaHtml = "";
          if (isVideo) {
            mediaHtml = `<video src="${src}" style="width:100%; height:100%; object-fit:cover;" controls></video>`;
          } else {
            mediaHtml = `<img src="${src}" style="width:100%; height:100%; object-fit:cover;">`;
          }

          return `<div class="gallery-item">${mediaHtml}</div>`;
        });
        container.innerHTML = renderedItems.join("");
      }

      // Star Rating Interaction
      function initStarRating() {
        const stars = document.querySelectorAll(".star");
        const ratingInput = document.getElementById("rating-value");
        let selectedRating = 0;

        stars.forEach((star) => {
          star.addEventListener("click", function () {
            selectedRating = parseInt(this.getAttribute("data-rating"));
            ratingInput.value = selectedRating;
            updateStars(selectedRating);
          });

          star.addEventListener("mouseover", function () {
            const hoverRating = parseInt(this.getAttribute("data-rating"));
            updateStars(hoverRating);
          });
        });

        const starRating = document.querySelector(".star-rating");
        if (starRating) {
          starRating.addEventListener("mouseout", function () {
            updateStars(selectedRating);
          });
        }

        window.updateStars = function (rating) {
          stars.forEach((star, index) => {
            if (index < rating) {
              star.textContent = "★";
              star.style.color = "var(--secondary-orange)";
            } else {
              star.textContent = "☆";
              star.style.color = "#ccc";
            }
          });
        };
      }

      // Load and display reviews
      function loadReviews() {
        const reviewsListEl = document.getElementById("reviews-list");
        const list = electrician.reviewsList || [];

        if (list.length === 0) {
          reviewsListEl.innerHTML =
            '<p style="color: var(--text-gray); text-align: center;">No reviews yet. Be the first to review!</p>';
          return;
        }

        reviewsListEl.innerHTML = list
          .map(
            (review) => `
          <div class="review-card">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
              <div>
                <strong style="font-size: 1.1rem; color: #1e293b;">${review.name}</strong>
                <div style="color: #fbbf24; margin-top: 4px; font-size: 1.1rem; letter-spacing: 1px;">${"★".repeat(
                  review.rating
                )}${"☆".repeat(5 - review.rating)}</div>
              </div>
              <small style="color: #94a3b8; font-weight: 500;">${new Date(
                review.date
              ).toLocaleDateString()}</small>
            </div>
            ${
              review.comment
                ? `<p style="color: #475569; margin-top: 10px; line-height: 1.6;">${review.comment}</p>`
                : ""
            }
          </div>
        `
          )
          .join("");
      }

      // Submit Review - ASYNC to API
      document.addEventListener("submit", async function (e) {
        if (e.target.id !== "review-form") return;
        e.preventDefault();

        const ratingInput = document.getElementById("rating-value");
        const rating = parseInt(ratingInput.value);
        const name = document.getElementById("reviewer-name").value;
        const comment = document.getElementById("review-comment").value;

        if (rating === 0) {
          ModalManager.alert("Please select a rating", "Notice");
          return;
        }

        try {
          const res = await fetch(`${API_BASE_URL}/api/electricians/${electrician.id}/review`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              rating: rating,
              name: name,
              comment: comment,
            }),
            credentials: "include", // Need session to post
          });

          if (res.ok) {
            ModalManager.alert("Thank you for your review!", "Success");
            setTimeout(() => location.reload(), 1500);
          } else {
            ModalManager.alert("Failed to submit review", "Error");
          }
        } catch (err) {
          console.error("Error submitting review:", err);
          ModalManager.alert("Error submitting review", "Error");
        }
      });

      // Init
      initProfile();
    </script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
